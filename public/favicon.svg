<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="brassGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fdf3cf"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#593b0b"/>
    </radialGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="50%" stop-color="#180e09"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </linearGradient>
    <filter id="vintageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Antiqued Brass Coin Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#brassGlow)" filter="url(#vintageShadow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#2a1810" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <circle cx="32" cy="32" r="25" fill="url(#shieldFill)" stroke="#c59b27" stroke-width="1"/>
  
  <!-- Classic Heraldic Shield Outline -->
  <path d="M32 14 C39 14, 44 16, 46 22 C46 33, 38 42, 32 47 C26 42, 18 33, 18 22 C20 16, 25 14, 32 14 Z" 
        fill="#21140e" stroke="url(#brassGlow)" stroke-width="1.5"/>
  
  <!-- Inner Heraldic Star / Laurel Touch -->
  <circle cx="32" cy="20" r="1.5" fill="#fef08a"/>
  
  <!-- Classic Roman Numeral "I" for Render 1 -->
  <path d="M28 25 H36 M32 25 V38 M28 38 H36" stroke="url(#brassGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
